services:
  webui:
    build:
      context: .
    image: compute-webui:latest
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-28449}
      STAGE_PORT: ${STAGE_PORT:-28448}
      BACKEND_IP: ${BACKEND_IP:-}
      BACKEND_HOST: ${BACKEND_HOST:-}
      BACKEND_PORT: ${BACKEND_PORT:-28448}
      WEBRTC_IP: ${WEBRTC_IP:-}
      WEBRTC_HOST: ${WEBRTC_HOST:-}
      WEBRTC_PORT: ${WEBRTC_PORT:-28450}
      DOG_WEBRTC_IP: ${DOG_WEBRTC_IP:-}
      DOG_WEBRTC_HOST: ${DOG_WEBRTC_HOST:-}
      DOG_WEBRTC_PORT: ${DOG_WEBRTC_PORT:-28451}
      DOG_ENHANCED_WEBRTC_IP: ${DOG_ENHANCED_WEBRTC_IP:-}
      DOG_ENHANCED_WEBRTC_HOST: ${DOG_ENHANCED_WEBRTC_HOST:-}
      DOG_ENHANCED_WEBRTC_PORT: ${DOG_ENHANCED_WEBRTC_PORT:-28452}
      STAGE_API_URL: ${STAGE_API_URL:-}
      LATENCY_API_URL: ${LATENCY_API_URL:-}
      QOS_PUSH_CHANNEL: ${QOS_PUSH_CHANNEL:-}
      QOS_PUSH_CHANNEL_URL: ${QOS_PUSH_CHANNEL_URL:-}
      WEBRTC_SIGNAL_URL: ${WEBRTC_SIGNAL_URL:-}
      DOG_WEBRTC_SIGNAL_URL: ${DOG_WEBRTC_SIGNAL_URL:-}
      DOG_ENHANCED_WEBRTC_SIGNAL_URL: ${DOG_ENHANCED_WEBRTC_SIGNAL_URL:-}
      COMPUTE_WEBUI_STORY_SCENARIO: ${COMPUTE_WEBUI_STORY_SCENARIO:-blind_box_store}
      WEBRTC_ADVERTISE_IP: ${WEBRTC_ADVERTISE_IP:-auto}
      INITIAL_STAGE: ${INITIAL_STAGE:-1}
      ENABLE_STAGE_SERVER: ${ENABLE_STAGE_SERVER:-true}
      ENABLE_WEBRTC_SERVERS: ${ENABLE_WEBRTC_SERVERS:-true}
    ports:
      - "${FRONTEND_PORT:-28449}:${FRONTEND_PORT:-28449}"
      - "${STAGE_PORT:-28448}:${STAGE_PORT:-28448}"
      - "${WEBRTC_PORT:-28450}:${WEBRTC_PORT:-28450}"
      - "${DOG_WEBRTC_PORT:-28451}:${DOG_WEBRTC_PORT:-28451}"
      - "${DOG_ENHANCED_WEBRTC_PORT:-28452}:${DOG_ENHANCED_WEBRTC_PORT:-28452}"
